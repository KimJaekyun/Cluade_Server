<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토끼 당근 피하기 - 소개</title>
<style>
  html,body{margin:0;height:100%;background:#111a30;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}
</style>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W=1280,H=720,GROUND=620,DUR=10;
  var FONT='bold 120px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  var start=performance.now();

  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function prog(t,a,b){return clamp((t-a)/(b-a),0,1)}
  function easeOutBack(x){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
  function easeOutBounce(x){
    var n=7.5625,d=2.75;
    if(x<1/d)return n*x*x;
    if(x<2/d)return n*(x-=1.5/d)*x+.75;
    if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;
    return n*(x-=2.625/d)*x+.984375;
  }

  function drawBg(t){
    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd3ff');g.addColorStop(1,'#e8f7d4');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // 흐르는 구름
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(var i=0;i<4;i++){
      var x=((i*380-t*30)%1600+1600)%1600-200,y=90+i*55;
      ctx.beginPath();ctx.ellipse(x,y,90,30,0,0,7);ctx.ellipse(x+50,y-18,60,28,0,0,7);ctx.ellipse(x-45,y-10,50,22,0,0,7);ctx.fill();
    }
    ctx.fillStyle='#7ccd6a';ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.fillStyle='#5fb04f';ctx.fillRect(0,GROUND,W,10);
  }

  function drawRabbit(x,t,s){
    var run=t*14,bob=Math.abs(Math.sin(run))*28;
    ctx.save();ctx.translate(x,GROUND-60*s-bob);ctx.scale(s,s);
    ctx.rotate(-0.08);
    ctx.fillStyle='#fff';ctx.strokeStyle='#8a8a9a';ctx.lineWidth=3;
    // 뒷다리/앞다리
    var sw=Math.sin(run)*16;
    ctx.beginPath();ctx.ellipse(-16+sw,48,16,8,0,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(16-sw,48,16,8,0,0,7);ctx.fill();ctx.stroke();
    // 꼬리
    ctx.beginPath();ctx.arc(-34,10,9,0,7);ctx.fill();ctx.stroke();
    // 귀 (뒤로 휘날림)
    [-9,9].forEach(function(ox,i){
      ctx.save();ctx.translate(ox+8,-34);ctx.rotate(-0.5+Math.sin(run+i)*0.15);
      ctx.beginPath();ctx.ellipse(0,-18,9,24,0,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffb6c8';ctx.beginPath();ctx.ellipse(0,-18,4.5,17,0,0,7);ctx.fill();
      ctx.restore();ctx.fillStyle='#fff';
    });
    // 몸·머리
    ctx.beginPath();ctx.ellipse(0,16,30,24,0,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(16,-12,26,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(26,-18,3.8,0,7);ctx.fill();
    ctx.fillStyle='#ff8fa8';ctx.beginPath();ctx.arc(40,-8,3.8,0,7);ctx.fill();
    ctx.fillStyle='#ffc9d6';ctx.beginPath();ctx.arc(24,-2,5,0,7);ctx.fill();
    ctx.restore();
  }

  function drawCarrot(x,y,rot,s){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
    ctx.fillStyle='#3fae49';
    ctx.beginPath();ctx.ellipse(-6,-34,4.5,12,-0.4,0,7);ctx.ellipse(0,-37,4.5,13,0,0,7);ctx.ellipse(6,-34,4.5,12,0.4,0,7);ctx.fill();
    ctx.fillStyle='#ff7a1a';ctx.beginPath();
    ctx.moveTo(-15,-24);ctx.quadraticCurveTo(0,-33,15,-24);ctx.lineTo(0,40);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#d85d00';ctx.lineWidth=2.2;
    for(var i=-9;i<=9;i+=9){ctx.beginPath();ctx.moveTo(i-6,-12+Math.abs(i)*.5);ctx.lineTo(i+2,-6+Math.abs(i)*.5);ctx.stroke()}
    ctx.restore();
  }

  function text(str,x,y,size,fill,stroke){
    ctx.font=FONT.replace('120px',size+'px');
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineJoin='round';ctx.lineWidth=size*0.12;
    ctx.strokeStyle=stroke;ctx.strokeText(str,x,y);
    ctx.fillStyle=fill;ctx.fillText(str,x,y);
  }

  // 당근 낙하 일정: [등장시각, x]
  var DROPS=[[3.6,260],[4.2,520],[4.8,820],[5.4,1020],[6.0,380],[6.6,700],[7.2,1130],[7.7,150]];

  function frame(now){
    var t=Math.min((now-start)/1000,DUR+3600); // 끝난 뒤에도 마지막 장면 유지
    var tt=Math.min(t,DUR);
    drawBg(t);

    // 1) 제목 튀어나오기 (0~1.2초), 이후 위로 줄어 자리잡기 (2.5~3.5초)
    var pop=easeOutBack(prog(tt,0.2,1.2));
    var settle=prog(tt,2.5,3.5);
    var ty=H/2-settle*(H/2-130);
    var sc=(pop*(1-settle*0.4)),wob=Math.sin(tt*3)*0.02*(1-settle);
    if(tt>0.2){
      ctx.save();ctx.translate(W/2,ty);ctx.rotate(wob);ctx.scale(sc,sc);
      text('토끼 당근 피하기',0,0,120,'#ff8a3d','#fff');
      ctx.restore();
    }

    // 2) 토끼 달리기 (2.2~6.8초, 왼쪽 밖에서 오른쪽 밖으로)
    var rp=prog(tt,2.2,6.8);
    if(rp>0&&rp<1)drawRabbit(-100+rp*(W+200),tt,1.7);

    // 3) 당근 떨어지기
    DROPS.forEach(function(d,i){
      var p=(tt-d[0])/1.1;
      if(p<0)return;
      var y;
      if(p<1)y=-60+(GROUND-40+60)*p*p; // 가속 낙하
      else{var b=easeOutBounce(clamp(p-1,0,1));y=GROUND-40-(1-b)*0;
        // 땅에 닿고 작게 튕김
        y=GROUND-40-Math.abs(Math.sin((p-1)*5))*30*Math.max(0,1-(p-1)*1.2);}
      drawCarrot(d[1],y,(p<1?p*3:3)*(i%2?1:-1)*0.3,1.3);
    });

    // 4) 마지막: 지금 플레이 깜빡임 (8~10초 등장 후 계속)
    if(tt>=8){
      var a=prog(tt,8,8.4);
      var blink=(Math.floor((tt-8)*2.5)%2===0)?1:0.15;
      ctx.save();ctx.globalAlpha=a*blink;
      ctx.translate(W/2,H/2+60);
      ctx.fillStyle='rgba(31,42,68,.75)';
      ctx.beginPath();ctx.roundRect?ctx.roundRect(-330,-80,660,160,40):ctx.rect(-330,-80,660,160);ctx.fill();
      text('지금 플레이',0,0,110,'#ffd54a','#7a3d00');
      ctx.restore();
    }

    // 진행 바 (10초 표시)
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,H-8,W,8);
    ctx.fillStyle='#ff8a3d';ctx.fillRect(0,H-8,W*tt/DUR,8);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 클릭/터치하면 처음부터 다시 재생
  // 지금 플레이 버튼 영역(캔버스 좌표)
  function onButton(e){
    if((performance.now()-start)/1000<8.4)return false;
    var r=cv.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
    return Math.abs(x-W/2)<=330&&Math.abs(y-(H/2+60))<=80;
  }
  cv.addEventListener('pointermove',function(e){cv.style.cursor=onButton(e)?'pointer':'default'});
  cv.addEventListener('pointerdown',function(e){
    if(onButton(e))window.location.href='index.html'; // 게임으로 이동
    else start=performance.now();                      // 그 밖의 곳은 다시 재생
  });
})();
</script>
</body>
</html>
